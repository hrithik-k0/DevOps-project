appiVersion: app/v1
kind: Deployment
metadata:
  name: devops-app
spec:
  replicas: 2
  selector:
   matchLabels:
     app: devops-app
  template:
    metadata:
      labels:
        app: devops-app
    spec:
      containers:
      - name: devops-app
        image: hk00d/devops-app
        ports:
        - containerport: 3000          